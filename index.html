<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breast Cancer Stage Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #172033; }
    .container { max-width: 900px; margin: 40px auto; padding: 24px; }
    .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    .note { background: #fff7e6; padding: 14px; border-radius: 10px; margin-bottom: 22px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #ccd3df; border-radius: 8px; }
    button { margin-top: 22px; width: 100%; padding: 13px; border: 0; border-radius: 9px; cursor: pointer; font-weight: 700; }
    #result { margin-top: 22px; padding: 18px; border-radius: 10px; background: #eef6ff; display: none; }
    @media(max-width: 650px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Breast Cancer Stage Predictor</h1>
    <p>SEER-based XGBoost research demonstration.</p>

    <div class="note">
      This application is for research/educational demonstration only.
      It is not a medical diagnosis or treatment recommendation.
    </div>

    <form id="predictionForm">
      <div class="grid" id="fields"></div>
      <button type="submit">Predict Stage</button>
    </form>

    <div id="result"></div>
  </div>
</div>

<script>
const features = [
  "Age", "Race", "Marital Status", "T Stage", "N Stage",
  "Grade", "A Stage", "Tumor Size", "Estrogen Status",
  "Progesterone Status", "Regional Node Examined",
  "Reginol Node Positive", "Survival Months", "Status"
];

const fields = document.getElementById("fields");

features.forEach((name, i) => {
  const wrapper = document.createElement("div");
  const label = document.createElement("label");
  const input = document.createElement("input");

  label.textContent = name;
  input.name = name;
  input.required = true;
  input.placeholder = "Enter " + name;

  wrapper.appendChild(label);
  wrapper.appendChild(input);
  fields.appendChild(wrapper);
});

document.getElementById("predictionForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {};
  new FormData(e.target).forEach((value, key) => data[key] = value);

  const result = document.getElementById("result");
  result.style.display = "block";
  result.textContent = "Predicting...";

  try {
    const response = await fetch("/api/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({data})
    });

    const json = await response.json();

    if (!response.ok) {
      throw new Error(json.detail || "Prediction failed.");
    }

    result.innerHTML =
      "<strong>Predicted Stage:</strong> " + json.predicted_stage +
      "<br><strong>Model confidence:</strong> " +
      json.confidence_percent + "%";
  } catch (error) {
    result.textContent = "Error: " + error.message;
  }
});
</script>
</body>
</html>
